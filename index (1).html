<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión Sujeciones</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;color:#1a2233;min-height:100vh}
.top-bar{background:#1a3a5c;color:#fff;padding:14px 18px;font-size:1.1em;font-weight:bold;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.top-bar svg{flex-shrink:0}
.page{display:none;padding:16px;max-width:520px;margin:0 auto}
.page.active{display:block}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{font-size:1.05em;color:#1a3a5c;margin-bottom:14px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:9px;font-size:1em;font-weight:bold;cursor:pointer;margin-bottom:10px;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-blue{background:#1a3a5c;color:#fff}
.btn-outline{background:#fff;color:#1a3a5c;border:2px solid #1a3a5c}
.btn-green{background:#2e7d32;color:#fff}
.btn-sm{padding:8px 16px;border-radius:7px;font-size:.9em;width:auto;display:inline-block}
.zona-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo-btn{background:#fff;border:2px solid #c8d5e5;border-radius:10px;padding:16px 12px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.tipo-btn:hover{border-color:#1a3a5c}
.tipo-btn.sel{border-color:#1a3a5c;background:#e8f0f8}
.tipo-btn .t-title{font-weight:bold;color:#1a3a5c;font-size:.95em}
.tipo-btn .t-sub{font-size:.8em;color:#667;margin-top:3px}
label.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
label.check-row:last-child{border-bottom:none}
label.check-row input[type=checkbox]{width:20px;height:20px;accent-color:#1a3a5c;flex-shrink:0;cursor:pointer}
.item-info{flex:1}
.item-name{font-size:.93em;font-weight:600}
.item-qty{font-size:.8em;color:#888;margin-top:2px}
.item-img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0}
.kit-card{background:#f7f9fc;border:1px solid #d0dce8;border-radius:10px;margin-bottom:10px;overflow:hidden}
.kit-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none}
.kit-hdr-left{display:flex;align-items:center;gap:10px}
.kit-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.kit-name{font-weight:bold;font-size:.95em}
.kit-arrow{font-size:1.1em;color:#668;transition:transform .2s}
.kit-arrow.open{transform:rotate(180deg)}
.kit-body{display:none;padding:0 14px 12px}
.kit-body.open{display:block}
.precinto-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid #e0e8f0}
.precinto-row label{font-size:.85em;color:#556;white-space:nowrap}
.precinto-row input{flex:1;border:1px solid #c8d5e5;border-radius:6px;padding:6px 10px;font-size:.88em}
.obs-area{width:100%;border:1px solid #c8d5e5;border-radius:8px;padding:10px;font-size:.93em;font-family:Arial,sans-serif;resize:vertical;min-height:80px}
.firma-input{width:100%;border:1px solid #c8d5e5;border-radius:8px;padding:10px;font-size:1em;font-family:Arial,sans-serif}
.firma-input.err{border-color:#c00}
.success-box{background:#e8f5e9;border:2px solid #2e7d32;border-radius:10px;padding:20px;text-align:center;margin-bottom:14px}
.success-box .s-icon{font-size:2em;margin-bottom:6px}
.success-box .s-title{font-weight:bold;color:#2e7d32;font-size:1.05em}
.success-box .s-sub{font-size:.85em;color:#444;margin-top:4px}
.sep{height:1px;background:#e0e8f0;margin:14px 0}
.q-box{background:#fff3e0;border:2px solid #f57c00;border-radius:10px;padding:16px;margin-bottom:12px}
.q-box .q-title{font-weight:bold;color:#e65100;margin-bottom:10px;font-size:.95em}
.q-opt{display:flex;align-items:center;gap:9px;padding:8px 0;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.06)}
.q-opt:last-child{border-bottom:none}
.q-opt input[type=radio]{width:18px;height:18px;accent-color:#e65100;flex-shrink:0}
.q-opt span{font-size:.9em}
.btn-confirm{background:#e65100;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:.9em;font-weight:bold;cursor:pointer;margin-top:10px}
.hidden{display:none}
.warn{color:#c00;font-size:.82em;margin-top:4px}
@media(max-width:400px){.zona-btns{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top-bar">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
Revisión Sujeciones · Urgencias
</div>

<!-- PAGE 0: ZONA -->
<div class="page active" id="pg-zona">
<div class="card" style="margin-top:16px">
<h2>Selecciona la zona</h2>
<div class="zona-btns">
<button class="btn btn-blue" onclick="selZona(1)">Zona 1</button>
<button class="btn btn-blue" onclick="selZona(2)">Zona 2</button>
</div>
</div>
</div>

<!-- PAGE 1: TIPO -->
<div class="page" id="pg-tipo">
<div class="card" style="margin-top:16px">
<h2 id="tipo-title">Zona · Tipo de revisión</h2>
<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
<button class="tipo-btn" id="tb-martes" onclick="selTipo('martes')">
<div class="t-title">📅 Revisión de los martes</div>
<div class="t-sub">Revisión semanal de todos los kits</div>
</button>
<button class="tipo-btn" id="tb-uso" onclick="selTipo('uso')">
<div class="t-title">⚠️ Revisión tras uso</div>
<div class="t-sub">Después de haber utilizado sujeciones</div>
</button>
</div>
<button class="btn btn-outline" onclick="goPage('pg-zona')">← Volver</button>
</div>
</div>

<!-- PAGE 2: KIT SELECTOR (tras uso) -->
<div class="page" id="pg-kit-sel">
<div class="card" style="margin-top:16px">
<h2 id="kitsel-title">¿Qué kit se utilizó?</h2>
<div id="kitsel-opts" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px"></div>
<button class="btn btn-outline" onclick="goPage('pg-tipo')">← Volver</button>
</div>
</div>

<!-- PAGE 3: PREGUNTAS (tras uso) -->
<div class="page" id="pg-preguntas">
<div class="card" style="margin-top:16px">
<h2 id="preg-title">Revisión tras uso</h2>
<div id="preg-container"></div>
<button class="btn btn-outline" style="margin-top:10px" onclick="goPage('pg-kit-sel')">← Volver</button>
</div>
</div>

<!-- PAGE 4: CHECKLIST -->
<div class="page" id="pg-checklist">
<div id="cl-header" class="card" style="margin-top:16px;margin-bottom:10px">
<div style="font-weight:bold;color:#1a3a5c;font-size:1em" id="cl-title"></div>
<div style="font-size:.82em;color:#667;margin-top:3px" id="cl-sub"></div>
</div>
<div id="kits-container"></div>
<div class="card">
<h2>Observaciones</h2>
<textarea class="obs-area" id="obs-field" placeholder="Escribe aquí cualquier observación..."></textarea>
</div>
<div class="card">
<h2>Firma TCAE</h2>
<input class="firma-input" id="firma-name" type="text" placeholder="Nombre y apellido">
<div id="firma-warn" class="warn hidden">Por favor, escribe tu nombre.</div>
<button class="btn btn-green" style="margin-top:12px" onclick="firmar()">Guardar y descargar PDF</button>
</div>
<div id="success-area" class="hidden">
<div class="success-box">
<div class="s-icon">✅</div>
<div class="s-title" id="s-filename"></div>
<div class="s-sub">Revisión guardada correctamente</div>
</div>
<button class="btn btn-outline" onclick="nuevaRevision()">Nueva revisión</button>
</div>
<div style="height:20px"></div>
</div>

function selZona(z) {
  state.zona = z;
  document.getElementById('tipo-title').textContent = 'Zona ' + z + ' · Tipo de revisión';
  ['tb-martes','tb-uso'].forEach(function(id){document.getElementById(id).classList.remove('sel');});
  state.tipo = '';
  goPage('pg-tipo');
}

function selTipo(t) {
  state.tipo = t;
  ['tb-martes','tb-uso'].forEach(function(id){document.getElementById(id).classList.remove('sel');});
  document.getElementById('tb-' + t).classList.add('sel');
  if (t === 'martes') {
    buildChecklist(null); // all kits
    goPage('pg-checklist');
  } else {
    buildKitSel();
    goPage('pg-kit-sel');
  }
}

function buildKitSel() {
  var z = state.zona;
  document.getElementById('kitsel-title').textContent = 'Zona ' + z + ' · ¿Qué kit se utilizó?';
  var keys = z === 1 ? ['z1M','z1L','z1XL','z1CajaM','z1CajaL','z1Camilla'] : ['z2M','z2L'];
  var cont = document.getElementById('kitsel-opts');
  cont.innerHTML = '';
  keys.forEach(function(k) {
    var d = kitsData[k];
    var btn = document.createElement('button');
    btn.className = 'btn btn-outline';
    btn.textContent = d.name;
    btn.style.borderColor = d.color;
    btn.style.color = d.color;
    (function(key){btn.onclick = function(){selKit(key);};})(k);
    cont.appendChild(btn);
  });
}

function selKit(k) {
  state.kitKey = k;
  buildPreguntas();
  goPage('pg-preguntas');
}

// TRAS USO: 4 pasos informativos
var pregState = {step:0};
var preguntas = [
  {
    q: '¿Cómo limpias los pinchos?',
    ans: 'Retira todos los pinchos y limpia con toallitas desinfectantes. Nunca sumergir ni enviar a lavandería.'
  },
  {
    q: '¿Cómo envías la sujeción a lavandería?',
    ans: 'Mete las piezas de tela en una bolsa azul y escribe URGENCIAS en la bolsa.'
  },
  {
    q: '¿Qué envías a lavandería?',
    ans: 'Solo las piezas de tela. Sin pinchos y sin imán.'
  },
  {
    q: '¿Tienes que reponer?',
    ans: 'Sí. Verifica el stock y repón lo necesario antes de guardar el kit.'
  },
  {
    q: '¿Has entregado el kit a Limpieza?',
    ans: 'Entrega el kit al servicio de Limpieza en mano.'
  }
];

function buildPreguntas() {
  pregState = {step:0};
  var kit = kitsData[state.kitKey];
  document.getElementById('preg-title').textContent = 'Revisión tras uso · ' + kit.name;
  renderPreguntas();
}

function renderPreguntas() {
  var cont = document.getElementById('preg-container');
  cont.innerHTML = '';
  for (var i = 0; i <= pregState.step && i < preguntas.length; i++) {
    cont.appendChild(buildPregBox(i, i < pregState.step));
  }
}

function buildPregBox(idx, locked) {
  var p = preguntas[idx];
  var box = document.createElement('div');
  box.className = 'q-box';
  box.id = 'q-box-' + idx;

  var title = document.createElement('div');
  title.className = 'q-title';
  title.textContent = (idx+1) + '. ' + p.q;
  box.appendChild(title);

  var ansDiv = document.createElement('div');
  ansDiv.style.cssText = 'font-size:.9em;color:#333;padding:8px 0 4px;line-height:1.5';
  ansDiv.textContent = p.ans;
  box.appendChild(ansDiv);

  if (locked) {
    var doneDiv = document.createElement('div');
    doneDiv.style.cssText = 'font-size:.85em;color:#2e7d32;font-weight:bold;padding-top:4px';
    doneDiv.textContent = '✓ Confirmado';
    box.appendChild(doneDiv);
    return box;
  }

  var btnConf = document.createElement('button');
  btnConf.className = 'btn-confirm';
  (function(i){btnConf.onclick = function(){confirmPreg(i);};})(idx);
  btnConf.textContent = idx < preguntas.length - 1 ? 'Entendido →' : 'Continuar con la revisión';
  btnConf.style.marginTop = '10px';
  box.appendChild(btnConf);
  return box;
}

function confirmPreg(idx) {
  if (idx < preguntas.length - 1) {
    pregState.step = idx + 1;
    renderPreguntas();
    var nextBox = document.getElementById('q-box-' + (idx+1));
    if (nextBox) nextBox.scrollIntoView({behavior:'smooth', block:'start'});
  } else {
    buildChecklist(state.kitKey);
    goPage('pg-checklist');
  }
}

function buildConjunto(z) {
  // Single unified checklist for martes review — one card with all items
  var keys = z === 1 ? ['z1M','z1L','z1XL','z1CajaM','z1CajaL','z1Camilla'] : ['z2M','z2L'];
  var card = document.createElement('div');
  card.className = 'kit-card';
  card.style.marginBottom = '10px';

  // Header
  var hdr = document.createElement('div');
  hdr.style.cssText = 'background:#1a3a5c;color:#fff;padding:12px 14px;font-weight:bold;font-size:.95em';
  hdr.textContent = 'Revisión conjunta · Zona ' + z;
  card.appendChild(hdr);

  var body = document.createElement('div');
  body.style.padding = '0 14px 14px';

  keys.forEach(function(key) {
    var kit = kitsData[key];
    // Section label
    var sec = document.createElement('div');
    sec.style.cssText = 'margin-top:12px;margin-bottom:4px;font-weight:bold;font-size:.88em;color:#1a3a5c;border-bottom:1px solid #d0dce8;padding-bottom:4px';
    sec.textContent = kit.name;
    body.appendChild(sec);

    kit.items.forEach(function(item, idx) {
      var uid = key + '-' + idx;
      var row = document.createElement('label');
      row.className = 'check-row';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'cb-' + uid;
      var info = document.createElement('div');
      info.className = 'item-info';
      var nm = document.createElement('div');
      nm.className = 'item-name';
      nm.textContent = item.l;
      info.appendChild(nm);
      if (item.q) {
        var qty = document.createElement('div');
        qty.className = 'item-qty';
        qty.textContent = item.q;
        info.appendChild(qty);
      }
      row.appendChild(cb);
      row.appendChild(info);
      if (item.img && IMGS[item.img]) {
        var img = document.createElement('img');
        img.className = 'item-img';
        img.src = IMGS[item.img];
        img.alt = item.l;
        row.appendChild(img);
      }
      body.appendChild(row);
    });

    // Precinto field per section
    var precRow = document.createElement('div');
    precRow.className = 'precinto-row';
    precRow.innerHTML = '<label>Nº Precinto:</label><input type="text" id="prec-' + key + '" placeholder="Número de precinto">';
    body.appendChild(precRow);
  });

  card.appendChild(body);
  return card;
}

function buildChecklist(kitKey) {
  var z = state.zona;
  var tipo = state.tipo;
  var clTitle = document.getElementById('cl-title');
  var clSub = document.getElementById('cl-sub');
  var cont = document.getElementById('kits-container');
  cont.innerHTML = '';
  document.getElementById('obs-field').value = '';
  document.getElementById('firma-name').value = '';
  document.getElementById('firma-warn').classList.add('hidden');
  document.getElementById('success-area').classList.add('hidden');

  if (tipo === 'martes') {
    clTitle.textContent = 'Revisión de los martes · Zona ' + z;
    clSub.textContent = 'Verificación semanal conjunta';
    cont.appendChild(buildConjunto(z));
  } else {
    var kit = kitsData[kitKey];
    clTitle.textContent = 'Revisión tras uso · Zona ' + z + ' · ' + kit.name;
    clSub.textContent = 'Verificación del kit utilizado';
    cont.appendChild(buildKitCard(kitKey));
  }
}

function buildKitCard(key) {
  var kit = kitsData[key];
  var card = document.createElement('div');
  card.className = 'kit-card';
  card.style.marginBottom = '10px';

  var hdr = document.createElement('div');
  hdr.className = 'kit-hdr';
  hdr.innerHTML = '<div class="kit-hdr-left">'
    + '<div class="kit-dot" style="background:' + kit.color + '"></div>'
    + '<div class="kit-name">' + kit.name + '</div>'
    + '</div>'
    + '<div class="kit-arrow" id="arr-' + key + '">▼</div>';
  hdr.onclick = (function(k){ return function(){ togKit(k); }; })(key);
  card.appendChild(hdr);

  var body = document.createElement('div');
  body.className = 'kit-body open';
  body.id = 'kb-' + key;

  kit.items.forEach(function(item, idx) {
    var uid = key + '-' + idx;
    var row = document.createElement('label');
    row.className = 'check-row';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = 'cb-' + uid;
    var info = document.createElement('div');
    info.className = 'item-info';
    var nm = document.createElement('div');
    nm.className = 'item-name';
    nm.textContent = item.l;
    var qty = document.createElement('div');
    qty.className = 'item-qty';
    qty.textContent = item.q;
    info.appendChild(nm);
    info.appendChild(qty);
    row.appendChild(cb);
    row.appendChild(info);
    if (item.img && IMGS[item.img]) {
      var img = document.createElement('img');
      img.className = 'item-img';
      img.src = IMGS[item.img];
      img.alt = item.l;
      row.appendChild(img);
    }
    body.appendChild(row);
  });

  // Precinto field
  var precRow = document.createElement('div');
  precRow.className = 'precinto-row';
  precRow.innerHTML = '<label>Nº Precinto:</label><input type="text" id="prec-' + key + '" placeholder="Número de precinto">';
  body.appendChild(precRow);

  // Arrow starts open
  var arr = document.getElementById('arr-' + key);
  if (arr) arr.classList.add('open');

  card.appendChild(body);
  return card;
}

function togKit(key) {
  var kb = document.getElementById('kb-' + key);
  var arr = document.getElementById('arr-' + key);
  if (!kb) return;
  var isOpen = kb.classList.contains('open');
  if (isOpen) {
    kb.classList.remove('open');
    if (arr) arr.classList.remove('open');
  } else {
    kb.classList.add('open');
    if (arr) arr.classList.add('open');
  }
}

function firmar() {
  var nameEl = document.getElementById('firma-name');
  var warnEl = document.getElementById('firma-warn');
  if (!nameEl.value.trim()) {
    nameEl.classList.add('err');
    warnEl.classList.remove('hidden');
    return;
  }
  nameEl.classList.remove('err');
  warnEl.classList.add('hidden');
  generatePDF(nameEl.value.trim());
}

function generatePDF(nombre) {
  var now = new Date();
  var dd = String(now.getDate()).padStart(2,'0');
  var mm = String(now.getMonth()+1).padStart(2,'0');
  var yyyy = now.getFullYear();
  var hh = String(now.getHours()).padStart(2,'0');
  var min = String(now.getMinutes()).padStart(2,'0');
  var dateStr = dd + '/' + mm + '/' + yyyy + ' ' + hh + ':' + min;
  var dateFile = dd + '-' + mm + '-' + yyyy;

  var obs = document.getElementById('obs-field').value.trim();
  var tieneObs = obs.length > 0;
  var zona = state.zona;
  var tipo = state.tipo === 'martes' ? 'Martes' : 'TraUso';
  var fileName = 'Sujeciones_Zona' + zona + '_' + tipo + '_' + dateFile + (tieneObs ? '_OBS' : '') + '.html';

  // Collect checklist data
  var kitsHtml = '';
  var cont = document.getElementById('kits-container');
  var allCards = cont.querySelectorAll('.kit-card');
  allCards.forEach(function(card) {
    var kitName = card.querySelector('.kit-name');
    var dot = card.querySelector('.kit-dot');
    var color = dot ? dot.style.background : '#333';
    var rows = card.querySelectorAll('.check-row');
    var precInput = card.querySelector('.precinto-row input');
    var precVal = precInput ? precInput.value.trim() : '';
    var itemsHtml = '';
    rows.forEach(function(row) {
      var cb = row.querySelector('input[type=checkbox]');
      var nm = row.querySelector('.item-name');
      var qty = row.querySelector('.item-qty');
      var img = row.querySelector('.item-img');
      var checked = cb && cb.checked;
      var icon = checked ? '✅' : '⬜';
      itemsHtml += '<tr style="border-bottom:1px solid #eee">'
        + '<td style="padding:7px 10px;font-size:1.3em">' + icon + '</td>'
        + '<td style="padding:7px 10px;font-weight:600">' + (nm ? nm.textContent : '') + '</td>'
        + '<td style="padding:7px 10px;color:#888;font-size:.9em">' + (qty ? qty.textContent : '') + '</td>'
        + (img ? '<td style="padding:4px"><img src="' + img.src + '" style="width:44px;height:44px;object-fit:cover;border-radius:5px"></td>' : '<td></td>')
        + '</tr>';
    });
    kitsHtml += '<div style="margin-bottom:18px;border:1px solid #ddd;border-radius:8px;overflow:hidden">'
      + '<div style="background:' + color + ';color:#fff;padding:10px 14px;font-weight:bold">'
      + (kitName ? kitName.textContent : 'Kit') + (precVal ? ' · Precinto: ' + precVal : '') + '</div>'
      + '<table style="width:100%;border-collapse:collapse">' + itemsHtml + '</table>'
      + '</div>';
  });

  var tipoLabel = state.tipo === 'martes' ? 'Revisión de los martes' : 'Revisión tras uso';
  var pdfContent = '<!DOCTYPE html><html><head><meta charset="UTF-8">'
    + '<title>Sujeciones Zona ' + zona + '</title>'
    + '<style>body{font-family:Arial,sans-serif;padding:24px;max-width:600px;margin:0 auto;color:#1a2233}'
    + 'h1{font-size:1.2em;color:#1a3a5c;margin-bottom:4px}'
    + '.meta{font-size:.85em;color:#667;margin-bottom:18px}'
    + '.obs-box{background:#fff3e0;border:1px solid #f57c00;border-radius:8px;padding:12px;margin-bottom:16px}'
    + '.firma-box{border-top:2px solid #1a3a5c;margin-top:20px;padding-top:12px;font-size:.9em;color:#556}'
    + '</style></head><body>'
    + '<h1>Revisión Sujeciones · Zona ' + zona + '</h1>'
    + '<div class="meta">' + tipoLabel + ' · ' + dateStr + '</div>'
    + kitsHtml
    + (obs ? '<div class="obs-box"><strong>⚠️ Observaciones:</strong><br>' + obs.replace(/\n/g,'<br>') + '</div>' : '')
    + '<div class="firma-box">TCAE: <strong>' + nombre + '</strong></div>'
    + '</body></html>';

  var blob = new Blob([pdfContent], {type:'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 1000);

  document.getElementById('s-filename').textContent = fileName;
  document.getElementById('success-area').classList.remove('hidden');
  document.getElementById('success-area').scrollIntoView({behavior:'smooth'});
}

function nuevaRevision() {
  state = {zona:0, tipo:'', kitKey:''};
  goPage('pg-zona');
}

function goPage(id) {
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
